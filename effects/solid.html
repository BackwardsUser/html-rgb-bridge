<head>
<title>Solid colour</title>
<meta description="One colour everywhere, optionally breathing." />
<meta property="color" label="Colour" type="color" default="#ff6a00" />
<meta property="breathe" label="Breathe" type="boolean" default="0" />
<meta property="rate" label="Breathing rate" type="number" min="1" max="10" default="3" />
</head>
<body style="margin:0;padding:0;background:#000">
<canvas id="exCanvas" width="320" height="200"></canvas>
<script>
const ctx = document.getElementById("exCanvas").getContext("2d");
function update(now) {
  const level = breathe ? 0.15 + 0.85 * (0.5 + 0.5 * Math.sin(now / 1000 * rate * 0.6)) : 1;
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 320, 200);
  ctx.globalAlpha = level;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 320, 200);
  requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script>
</body>
